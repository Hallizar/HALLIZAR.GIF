<style>
:root{--bg:#fff;--text:#292929;--muted:#858585;--line:#e5e5e5;--blue:#18a0fb;--blue2:#0c8ce9;--green:#16865b}
*{box-sizing:border-box}body{margin:0;padding:16px;font:12px Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);height:100vh;display:flex;flex-direction:column;gap:10px}
.controls{flex-shrink:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
label{font-weight:550;display:flex;align-items:center;gap:6px}
input[type=number],select{width:108px;border:1px solid var(--line);border-radius:5px;padding:6px;background:#fff;color:var(--text)}
input[type=range]{width:100%;min-width:0}
input[type=checkbox]{margin:0}
.quality-line{padding-left:20px;transition:opacity .2s}.disabled{opacity:.4;pointer-events:none}
button{border:0;border-radius:6px;background:var(--blue);color:#fff;padding:10px;font-weight:650;font-size:11px;cursor:pointer;width:100%}
button:hover{background:var(--blue2)}button:disabled{opacity:.45;cursor:not-allowed;background:#999}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--line);font-size:12px;text-transform:none}
button.secondary:hover{background:#f5f5f5}
#group-list{flex:1;min-height:0;overflow-y:auto;padding-right:3px}
.group-item{border:1px solid var(--line);border-radius:7px;margin-bottom:9px;overflow:hidden}
.group-header{padding:10px;background:#fafafa;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.group-title{font-size:13px;font-weight:700;overflow-wrap:anywhere}.group-meta{font-size:10px;color:var(--muted);margin-top:3px}
.status{font-size:10px;border-radius:4px;background:#eee;color:#777;padding:3px 6px;margin-left:5px;display:none}
.status.done{display:inline-block;background:#dff0d8;color:#3c763d}.status.loading{display:inline-block;background:#d9edf7;color:#31708f}.status.error{display:inline-block;background:#fbe9e7;color:#b3261e}
.group-content{display:none;padding:10px;border-top:1px solid var(--line)}.group-content.open{display:block}
.frame-list{max-height:75px;overflow:auto;font-size:10px;color:#666;background:#f5f5f5;padding:6px;margin:6px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.preview-area{display:none;flex-direction:column;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.preview-img{max-width:100%;max-height:260px;height:auto;border:1px solid #ddd;background:repeating-conic-gradient(#eee 0% 25%,transparent 0% 50%) 50%/16px 16px}
.small{font-size:10px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
#footer{flex-shrink:0;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
#notice{font-size:10px;color:var(--muted);line-height:1.4;min-height:14px}


</style>
</head>
<body>
<div class="controls">
  <div class="row"><label for="delay">Frame Delay (ms)</label><input id="delay" type="number" min="20" max="60000" step="10" value="2500"></div>
  <div class="row"><label for="scale">Resolution Scale</label><select id="scale"><option value="1">1x (Original)</option><option value="2">2x (Retina)</option><option value="0.5">0.5x</option></select></div>
  <div class="row" style="justify-content:flex-start"><input type="checkbox" id="lossy-check"><label for="lossy-check">Enable lossy compression</label></div>
  <div class="row quality-line disabled" id="quality-row">
    <label for="quality">Quality <span style="font-size:10px;color:#888">(1 lower – 100 best)</span></label>
    <div style="display:flex;align-items:center;gap:7px;width:57%"><input id="quality" type="range" min="1" max="100" value="90"><b id="quality-val">90</b></div>
  </div>
  <button id="scan-btn" class="secondary">↻ Scan / Refresh Selection</button>
</div>
<div id="group-list"><div class="small" style="margin-top:40px">Select frames in Figma and click Scan.</div></div>
<div id="footer">
  <div id="notice">Ready. Encoding runs locally in the plugin UI.</div>
  <button id="generate-all" disabled style="background:#2c3e50">▶ Generate All GIFs</button>
  <button id="download-all" disabled>Download ZIP</button>
</div>
